name: unpublish

# Removing a version from the registry, by hand and on purpose.
#
# This exists because a published tarball cannot be edited. When a version
# ships something it should not have, the only fix is to take that version off
# the registry and publish a clean one.
#
# Run it from the Actions tab. It asks for the version twice, once as the
# version and once as a typed confirmation, because there is no undo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The exact version to remove, for example 0.1.0
        required: true
      confirm:
        description: Type the same version again to confirm
        required: true

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless both inputs agree
        run: |
          if [ "${{ inputs.version }}" != "${{ inputs.confirm }}" ]; then
            echo "Inputs do not match. Nothing removed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # --force because npm treats removing a version as something you should
      # have to say twice, and the job has already asked once.
      - run: npm unpublish --force "asheard@${{ inputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
